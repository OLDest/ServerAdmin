name: Bug report
description: Report a reproducible ServerAdmin problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ServerAdmin. Never include passwords, keys, or tokens.
  - type: input
    id: version
    attributes:
      label: ServerAdmin version
      placeholder: 1.1.0.373
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: input
    id: proxmox
    attributes:
      label: Proxmox VE version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove all sensitive information before posting.
      render: shell
